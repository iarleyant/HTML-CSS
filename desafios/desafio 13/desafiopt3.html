<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Notas</title>

    <style>
        table {
            border-collapse: collapse;
            width: 650px;
            text-align: center;
            font-family: Arial;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        thead {
            background-color: #999;
            color: white;
        }

        .area {
            background-color: #ccc;
        }

        tfoot {
            background-color: #999;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<table>

    <thead>
        <tr>
            <th rowspan="2">Área</th>
            <th rowspan="2">Disciplinas</th>
            <th colspan="2">Notas</th>
            <th rowspan="2">Média</th>
        </tr>

        <tr>
            <th>Nota 1</th>
            <th>Nota 2</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td class="area" rowspan="4">Exatas</td>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td colspan="4"><strong>Média de Exatas</strong></td>
            <td>0.0</td>
        </tr>

        <tr>
            <td class="area" rowspan="2">Humanas</td>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="4">Média de Humanas</td>
            <td>0.0</td>
        </tr>
    </tfoot>

</table>

</body>
</html>
