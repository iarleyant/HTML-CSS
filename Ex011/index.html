<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmicas</h1>
    <p>tente abrir em dispositivos diferente ou simplesmente atualize o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width: 700px)" srcset="imagens/Sem título.png" type="image/png"> 
        <source media="(max-width: 1000px)" srcset="imagens/M.png" type="image/png">
        <img src="imagens/Minhas imagens.png" alt="imagens flexivel">
    </picture>
    
    <h1>reproduzindo Áudio</h1>
    <p>vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="media/longedaquiericlandy.mp3.mp3" controls autoplay></audio>

    
</body>
</html>
